<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treasure Reef 디오라마</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --scene-bg:#b48a6c;
  --ink:#2b170e;
  --ink-dim:rgba(43,23,14,.62);
  --chip:rgba(255,246,236,.55);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --scene-bg:#2a160f;
    --ink:#f4e7da;
    --ink-dim:rgba(244,231,218,.6);
    --chip:rgba(20,10,6,.5);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --scene-bg:#2a160f;
  --ink:#f4e7da;
  --ink-dim:rgba(244,231,218,.6);
  --chip:rgba(20,10,6,.5);
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{background:var(--scene-bg);overflow:hidden;font-family:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.brand{position:fixed;left:calc(20px + env(safe-area-inset-left,0px));top:calc(18px + env(safe-area-inset-top,0px));pointer-events:none;z-index:2}
.brand h1{margin:0;font-size:1.25rem;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.brand p{margin:.2rem 0 0;font-size:.82rem;color:var(--ink-dim)}
.hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--chip);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  padding:.5rem .95rem;border-radius:999px;font-size:.82rem;color:var(--ink);white-space:nowrap;
  transition:opacity .8s ease;pointer-events:none;z-index:2;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.hint.gone{opacity:0}
.err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;font-size:.95rem;color:var(--ink)}
.lil-gui{--font-family:'IBM Plex Sans KR',system-ui,sans-serif;--font-size:12px;--input-font-size:12px;--width:272px;--name-width:44%}
.lil-gui.autoPlace{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));max-height:calc(100% - 24px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));border-radius:10px;overflow:auto}
.lil-gui.root > .title{font-weight:600}
@media (max-width:640px){
  .lil-gui{--width:236px}
  .brand h1{font-size:1.05rem}
}
@media (prefers-reduced-motion: reduce){ .hint{transition:none} }
</style>
</head>
<body>
<div class="brand"><h1>Treasure Reef</h1><p>난파선과 보물상자가 잠든 바다 디오라마</p></div>
<div class="hint" id="hint">드래그해서 돌려보고, 물을 눌러 출렁이게 해보세요</div>
<div class="err" id="err">3D 장면을 불러오지 못했어요. 새로고침 해 주세요.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/HorizontalTiltShiftShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/VerticalTiltShiftShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.umd.min.js"></script>

<script>
(function(){
if(!window.THREE || !THREE.OrbitControls || !THREE.EffectComposer || !window.lil){
  document.getElementById('err').style.display='grid';
  return;
}

/* ───────────── basics ───────────── */
const col = h => new THREE.Color(h).convertSRGBToLinear();
let seed = 7;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a,b) => a + (b-a)*rand();
const pick = arr => arr[Math.floor(rand()*arr.length)];
const smooth = (e0,e1,x) => { const t = Math.min(1,Math.max(0,(x-e0)/(e1-e0))); return t*t*(3-2*t); };
function hash2(x,y){ const s = Math.sin(x*127.1 + y*311.7)*43758.5453; return s - Math.floor(s); }
function vnoise(x,y){ const xi=Math.floor(x), yi=Math.floor(y); const xf=x-xi, yf=y-yi; const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi), b=hash2(xi+1,yi), c=hash2(xi,yi+1), d=hash2(xi+1,yi+1); return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v; }
function fbm(x,y){ let f=0, a=0.5; for(let i=0;i<4;i++){ f+=a*vnoise(x,y); x*=2.03; y*=2.03; a*=0.5; } return f; }
function noise3(x,y,z){ return (vnoise(x+z*1.7, y-z*0.9) + vnoise(y*1.3+5.1, z+x*0.6))*0.5; }

const BOX = 6, HALF = 3, BASE_H = 1.05, WATER_TOP = 8.6, DEPTH = WATER_TOP - BASE_H;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const defaults = {
  vShallow:'#c9fbf2', shallow:'#56e2cf', mid:'#18b3b5', deep:'#0b6a84',
  sparkle:2.2, waveAmp:0.07, waveSpeed:1.0, opacity:0.5, murk:0.45,
  sunEl:56, sunAz:200, sunInt:2.6, caustic:1.6,
  stiffness:140, damping:2.2, mouse:1.0, slosh:1.0,
  fishCount:150, fishSpeed:1.0, divers:true, bubbles:true,
  tilt:true, blur:2.4, focus:0.46, autoRotate:false
};
const params = Object.assign({}, defaults);

/* ───────────── renderer / scene ───────────── */
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance'});
const PR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
function cssBg(){ return (getComputedStyle(document.documentElement).getPropertyValue('--scene-bg').trim() || '#2a160f'); }
const bgCol = col(cssBg());
scene.background = bgCol;
scene.fog = new THREE.Fog(bgCol, 34, 78);
const syncTheme = () => { const c = col(cssBg()); scene.background.copy(c); scene.fog.color.copy(c); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', syncTheme);
new MutationObserver(syncTheme).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

const camera = new THREE.PerspectiveCamera(30, innerWidth/innerHeight, 0.1, 200);
const target = new THREE.Vector3(0, 4.5, 0);
const camDir = new THREE.Vector3(1, 0.78, 1).normalize();
function fitDistance(){ const a = innerWidth/innerHeight; const t = Math.tan(THREE.MathUtils.degToRad(15)); return Math.max(25, 11.5/(2*t*a)); }
camera.position.copy(target).addScaledVector(camDir, fitDistance()*1.45);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.copy(target);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.minDistance = 10; controls.maxDistance = 60;
controls.maxPolarAngle = Math.PI*0.47;
controls.enablePan = true; controls.screenSpacePanning = true;
controls.autoRotateSpeed = 0.6;

/* environment for reflections */
(function makeEnv(){
  const pm = new THREE.PMREMGenerator(renderer);
  const s = new THREE.Scene();
  const g = new THREE.SphereGeometry(10, 32, 16);
  const p = g.attributes.position, c = [];
  const top = col('#fff3e2'), bot = col('#4a2a1c');
  for(let i=0;i<p.count;i++){ const y = p.getY(i)/10; const cc = bot.clone().lerp(top, Math.pow(y*0.5+0.5, 0.8)); c.push(cc.r,cc.g,cc.b); }
  g.setAttribute('color', new THREE.Float32BufferAttribute(c,3));
  s.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({side:THREE.BackSide, vertexColors:true})));
  const panel = new THREE.Mesh(new THREE.PlaneGeometry(7,4), new THREE.MeshBasicMaterial({color:new THREE.Color(5,4.8,4.4), side:THREE.DoubleSide}));
  panel.position.set(3,7,4); panel.lookAt(0,0,0); s.add(panel);
  scene.environment = pm.fromScene(s, 0.04).texture;
  pm.dispose();
})();

/* lights */
const hemi = new THREE.HemisphereLight(col('#fff1de'), col('#5a3320'), 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(col('#fff2dc'), params.sunInt);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sc = sun.shadow.camera; sc.left=-10; sc.right=10; sc.top=10; sc.bottom=-10; sc.near=1; sc.far=70;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.025;
sun.target.position.set(0, 3.5, 0);
scene.add(sun, sun.target);
const sunDir = new THREE.Vector3();

/* ───────────── shared uniforms + shader chunks ───────────── */
const U = {
  uTime:{value:0}, uWaterTop:{value:WATER_TOP}, uMurk:{value:params.murk},
  uVShallow:{value:col(params.vShallow)}, uShallow:{value:col(params.shallow)}, uMid:{value:col(params.mid)}, uDeep:{value:col(params.deep)},
  uCaustic:{value:params.caustic}, uSunInt:{value:params.sunInt}, uSunDir:{value:sunDir},
  uAmp:{value:params.waveAmp}, uWaveSpeed:{value:params.waveSpeed}, uWaveTime:{value:0},
  uTilt:{value:new THREE.Vector2()}, uRipples:{value:Array.from({length:8},()=>new THREE.Vector4(0,0,-99,0))},
  uSparkle:{value:params.sparkle}, uOpacity:{value:params.opacity}
};

const CAUSTIC_GLSL = `
float causticF(vec2 uv, float t){
  vec2 p = mod(uv*6.28318, 6.28318) - 250.0;
  vec2 i = p; float c = 1.0; float inten = 0.005;
  for(int n=0;n<4;n++){
    float tt = t*(1.0 - (3.5/float(n+1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0/length(vec2(p.x/(sin(i.x+tt)/inten), p.y/(cos(i.y+tt)/inten)));
  }
  c /= 4.0; c = 1.17 - pow(c, 1.4);
  return clamp(pow(abs(c), 8.0), 0.0, 2.0);
}`;

const WAVE_GLSL = `
uniform float uTime; uniform float uWaveTime; uniform float uAmp; uniform vec2 uTilt; uniform vec4 uRipples[8];
float waveH(vec2 p){
  float t = uWaveTime;
  float h = 0.5*sin(p.x*1.3 + t*1.1) + 0.35*sin(p.y*1.7 - t*1.4 + p.x*0.4)
          + 0.22*sin((p.x+p.y)*2.6 + t*2.1) + 0.12*sin((p.x-p.y)*4.1 - t*2.7);
  h *= uAmp;
  h += dot(p, uTilt);
  for(int k=0;k<8;k++){
    vec4 r = uRipples[k];
    float age = uTime - r.z;
    if(r.w <= 0.0 || age < 0.0 || age > 6.0) continue;
    float d = distance(p, r.xy);
    float front = age*2.2;
    float env = exp(-pow((d-front)*2.0, 2.0));
    h += r.w * 0.16 * env * sin((d-front)*15.0) * exp(-age*0.9);
  }
  return h;
}`;

const NOISE_GLSL = `
float hash12(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
  return mix(mix(hash12(i),hash12(i+vec2(1.0,0.0)),f.x), mix(hash12(i+vec2(0.0,1.0)),hash12(i+vec2(1.0,1.0)),f.x), f.y); }`;

/* underwater look for standard materials: caustic light + depth tint (+ optional sway) */
function underwater(mat, sway=0, ext=null){
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.uTime = U.uTime; sh.uniforms.uWaterTop = U.uWaterTop; sh.uniforms.uMurk = U.uMurk;
    sh.uniforms.uDeep = U.uDeep; sh.uniforms.uMid = U.uMid; sh.uniforms.uCaustic = U.uCaustic; sh.uniforms.uSunInt = U.uSunInt;
    sh.uniforms.uSway = {value:sway};
    sh.vertexShader = 'varying vec3 vCW;\nvarying vec3 vCN;\nuniform float uTime;\nuniform float uSway;\n' + (ext ? ext.head : '') + sh.vertexShader
      .replace('#include <begin_vertex>', `#include <begin_vertex>
        ${ext ? ext.body : ''}
        if(uSway > 0.0){
          vec3 ip = (modelMatrix*vec4(0.0,0.0,0.0,1.0)).xyz;
          #ifdef USE_INSTANCING
          ip += instanceMatrix[3].xyz;
          #endif
          float hh = max(transformed.y, 0.0);
          transformed.x += sin(uTime*1.3 + ip.x*2.1 + ip.z*1.3 + hh*2.5)*uSway*hh*hh;
          transformed.z += cos(uTime*1.05 + ip.z*2.3 + hh*2.0)*uSway*0.6*hh*hh;
        }`)
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 cwp = vec4(transformed, 1.0);
        vec3 cn = objectNormal;
        #ifdef USE_INSTANCING
        cwp = instanceMatrix*cwp;
        cn = mat3(instanceMatrix)*cn;
        #endif
        cwp = modelMatrix*cwp; vCW = cwp.xyz;
        vCN = normalize(mat3(modelMatrix)*cn);`);
    sh.fragmentShader = 'varying vec3 vCW;\nvarying vec3 vCN;\nuniform float uTime;\nuniform float uWaterTop;\nuniform float uMurk;\nuniform float uCaustic;\nuniform float uSunInt;\nuniform vec3 uDeep;\nuniform vec3 uMid;\n' + CAUSTIC_GLSL + '\n' + sh.fragmentShader
      .replace('#include <tonemapping_fragment>', `
        float dep = uWaterTop - vCW.y;
        if(dep > 0.0){
          float cz = causticF(vCW.xz*0.32 + vec2(0.0, vCW.y*0.05), uTime*0.55);
          float up = clamp(vCN.y*0.75 + 0.25, 0.0, 1.0);
          gl_FragColor.rgb += vec3(0.78,1.0,0.94) * cz * up * exp(-dep*0.1) * uCaustic * uSunInt * 0.16;
          float m = clamp(dep/7.5, 0.0, 1.0);
          vec3 absorb = exp(-dep*vec3(0.16, 0.055, 0.045)*(0.3 + uMurk*1.4));
          vec3 scatter = mix(uMid, uDeep, m);
          float sf = (1.0 - exp(-dep*0.2))*uMurk*0.5;
          gl_FragColor.rgb = gl_FragColor.rgb*absorb*(1.0 - sf) + scatter*sf;
        }
        #include <tonemapping_fragment>`);
  };
  mat.customProgramCacheKey = () => 'uw' + (sway > 0 ? 's' : '') + (ext ? ext.key : '');
  return mat;
}
const stdMat = (hex, o={}) => underwater(new THREE.MeshStandardMaterial(Object.assign({color:col(hex), roughness:0.9, metalness:0}, o)), o._sway||0);

/* ───────────── canvas textures ───────────── */
function canvasTex(w, h, draw, srgb=true){
  const c = document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if(srgb) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t;
}
const woodTex = canvasTex(1024, 1024, (g,w,h) => {
  g.fillStyle = '#4e2416'; g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){
    const y = rand()*h, a = rr(0.03,0.16), light = rand() < 0.5;
    g.strokeStyle = light ? `rgba(140,66,38,${a*0.6})` : `rgba(30,10,4,${a*0.8})`;
    g.lineWidth = rr(0.6, 3.5); g.beginPath();
    const amp = rr(1,6), fr = rr(0.004,0.02), ph = rand()*6;
    for(let x=0;x<=w;x+=16){ const yy = y + Math.sin(x*fr+ph)*amp; x===0 ? g.moveTo(x,yy) : g.lineTo(x,yy); }
    g.stroke();
  }
  for(let k=0;k<5;k++){ const y=k*256; g.fillStyle='rgba(18,6,2,.55)'; g.fillRect(0,y,w,2); }
});
woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping; woodTex.repeat.set(4,4); woodTex.rotation = 0.55;

const sandTex = canvasTex(512, 512, (g,w,h) => {
  g.fillStyle = '#eadcbc'; g.fillRect(0,0,w,h);
  for(let i=0;i<6000;i++){ g.fillStyle = `rgba(${rand()<.5?'150,128,92':'255,250,236'},${rr(.08,.35)})`; g.fillRect(rand()*w, rand()*h, rr(.6,2), rr(.6,2)); }
  g.lineWidth = 2;
  for(let y=-20;y<h+20;y+=11){ g.strokeStyle='rgba(170,146,104,.22)'; g.beginPath(); for(let x=0;x<=w;x+=8){ const yy=y+Math.sin(x*0.045+y*0.3)*4; x===0?g.moveTo(x,yy):g.lineTo(x,yy);} g.stroke(); }
});
sandTex.wrapS = sandTex.wrapT = THREE.RepeatWrapping; sandTex.repeat.set(2.5,2.5);

const strataTex = canvasTex(512, 128, (g,w,h) => {
  const grd = g.createLinearGradient(0,0,0,h); grd.addColorStop(0,'#e9d9b5'); grd.addColorStop(.45,'#d9c39a'); grd.addColorStop(1,'#bba27a');
  g.fillStyle = grd; g.fillRect(0,0,w,h);
  for(let i=0;i<14;i++){ const y=rr(8,h-4); g.strokeStyle=`rgba(${rand()<.5?'120,96,62':'255,246,226'},${rr(.12,.3)})`; g.lineWidth=rr(1,3); g.beginPath();
    for(let x=0;x<=w;x+=10){ const yy=y+Math.sin(x*0.03+i)*2; x===0?g.moveTo(x,yy):g.lineTo(x,yy);} g.stroke(); }
  for(let i=0;i<2500;i++){ g.fillStyle=`rgba(90,70,40,${rr(.05,.2)})`; g.fillRect(rand()*w, rand()*h, 1.2, 1.2); }
});

const fanTex = canvasTex(256, 256, (g,w,h) => {
  g.clearRect(0,0,w,h); g.strokeStyle = '#fff'; g.lineCap = 'round';
  const br = (x,y,a,len,lw,d) => { const x2=x+Math.cos(a)*len, y2=y+Math.sin(a)*len; g.lineWidth=lw; g.beginPath(); g.moveTo(x,y); g.lineTo(x2,y2); g.stroke();
    if(d>0){ br(x2,y2,a-0.32-rand()*0.2,len*0.82,lw*0.74,d-1); br(x2,y2,a+0.32+rand()*0.2,len*0.82,lw*0.74,d-1); } };
  br(128,252,-Math.PI/2,52,9,6);
  g.lineWidth = 1.3; g.globalAlpha = 0.9;
  for(let r=40;r<128;r+=9){ g.beginPath(); g.arc(128,252,r*1.6,Math.PI*1.12,Math.PI*1.88); g.stroke(); }
}, false);

const dotTex = canvasTex(64, 64, (g,w,h) => { const r=g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.4,'rgba(255,255,255,.5)'); r.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=r; g.fillRect(0,0,w,h); }, false);
const bubbleTex = canvasTex(64, 64, (g) => { g.strokeStyle='rgba(255,255,255,.95)'; g.lineWidth=5; g.beginPath(); g.arc(32,32,24,0,Math.PI*2); g.stroke();
  g.fillStyle='rgba(255,255,255,.25)'; g.beginPath(); g.arc(32,32,22,0,Math.PI*2); g.fill(); g.fillStyle='#fff'; g.beginPath(); g.arc(24,23,6,0,Math.PI*2); g.fill(); }, false);

/* ───────────── table ───────────── */
const table = new THREE.Mesh(new THREE.PlaneGeometry(120,120), new THREE.MeshStandardMaterial({map:woodTex, roughness:0.48, metalness:0, envMapIntensity:0.55}));
table.rotation.x = -Math.PI/2; table.receiveShadow = true; scene.add(table);

/* light that passes through the water onto the table */
const tableLight = new THREE.Mesh(new THREE.PlaneGeometry(40,40), new THREE.ShaderMaterial({
  transparent:true, depthWrite:false, blending:THREE.MultiplyBlending,
  uniforms:{ uMode:{value:0}, uSunDir:U.uSunDir, uTime:U.uTime, uCaustic:U.uCaustic, uSunInt:U.uSunInt, uTint:U.uMid, uHalf:{value:HALF}, uBase:{value:BASE_H}, uTop:{value:WATER_TOP} },
  vertexShader:`varying vec3 vW; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW=w.xyz; gl_Position = projectionMatrix*viewMatrix*w; }`,
  fragmentShader:`uniform vec3 uSunDir; uniform float uMode, uTime, uCaustic, uSunInt, uHalf, uBase, uTop; uniform vec3 uTint; varying vec3 vW;
    ${CAUSTIC_GLSL}
    vec2 axisRange(float pc, float lc, float a){
      if(abs(lc) < 1e-4) return abs(pc) < a ? vec2(-1e4, 1e4) : vec2(1e4, -1e4);
      float h1 = (-a - pc)/lc, h2 = (a - pc)/lc;
      return vec2(min(h1,h2), max(h1,h2));
    }

function lumpy(r, sq, s, baseHex){

  const base = col(baseHex), moss = col('#7fae5a'), pinkC = col('#d98aa0'), sandC = col('#cfc2a0'); const cc = new THREE.Color(); const cols = [];
  for(let i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); const n = v.clone().normalize();
    const big = noise3(n.x*2.2+s, n.y*2.2, n.z*2.2-s), fine = noise3(n.x*7+s, n.y*7, n.z*7), pits = noise3(n.x*14-s, n.y*14, n.z*14+s);

function taperTube(pts, r0, r1, radial=6, segs=10){
  const curve = new THREE.CatmullRomCurve3(pts);

    for(let j=0;j<=radial;j++){ const k = i*(radial+1) + j; v.fromBufferAttribute(p, k).sub(c).multiplyScalar(r).add(c); p.setXYZ(k, v.x, v.y, v.z); }

}

function ribbonGeo(w, h, segs, curl){

function updateJellies(dt, t){

}

      if(uv.y > 0.5) p.y += waveH(p.xz);
      vec4 w = modelMatrix*vec4(p,1.0); vW = w.xyz; vUv = uv; vNrm = normalize(mat3(modelMatrix)*normal);
      gl_Position = projectionMatrix*viewMatrix*w;
    }`,
  fragmentShader: `

    varying vec3 vW; varying vec2 vUv; varying vec3 vNrm;
    float exitDist(vec3 ro, vec3 rd){

      vec3 tf = max((bmin - ro)*inv, (bmax - ro)*inv);
      return max(min(min(tf.x, tf.y), tf.z), 0.0);
    }
    void main(){
      vec3 rd = normalize(vW - cameraPosition);
      float hN = clamp((vW.y - uBottom)/(uWaterTop - uBottom), 0.0, 1.0);
      vec3 body = mix(uDeep, uMid, smoothstep(0.0, 0.7, hN));
      body = mix(body, uShallow, smoothstep(0.7, 1.05, hN)*0.6);
      vec3 c = body*(0.55 + 0.45*clamp(uSunInt/2.6, 0.0, 1.6));

        float fres = pow(1.0 - abs(dot(normalize(vNrm), -rd)), 4.0);

        gl_FragColor = vec4(cc, clamp(a, 0.0, 0.9));
      }
    }`
}));

  for(let i=0;i<p.count;i++){

    const taper = z < 0 ? 1 - Math.pow(-z, 1.7)*0.84 : 1 - Math.pow(z, 2.4)*0.3;
    x *= 0.032*taper; y *= 0.058*taper; z *= 0.12;

    const cc = []; for(let i=0;i<arr.length/3;i++) cc.push(c, c, c); g.setAttribute('color', new THREE.Float32BufferAttribute(cc, 3)); return g; };

  const dorsal = tri([0,0.05,0.035, 0,0.09,-0.02, 0,0.04,-0.065], 0.72);
  const anal = tri([0,-0.038,-0.03, 0,-0.062,-0.065, 0,-0.024,-0.088], 0.85);
  const pecL = tri([0.026,-0.012,0.05, 0.062,-0.032,0.012, 0.03,-0.022,0.018], 0.9);
  const pecR = tri([-0.026,-0.012,0.05, -0.03,-0.022,0.018, -0.062,-0.032,0.012], 0.9);
  const eye = new THREE.SphereGeometry(0.0078, 8, 6); eye.deleteAttribute('uv');

fJ.add(params, 'slosh', 0, 3, 0.01).name('물 출렁임');
fJ.add({go(){ slosh(rr(-1,1), rr(-1,1), 0.07*params.slosh); jiggle(0.8); addRipple(rr(-1.5,1.5), rr(-1.5,1.5), 1.0); }}, 'go').name('출렁이게 하기');
const fL = gui.addFolder('바닷속  ·  Life');
fL.add(params, 'fishCount', 0, FISH_MAX, 1).name('물고기 수');
fL.add(params, 'fishSpeed', 0, 3, 0.01).name('헤엄 속도');
fL.add(params, 'divers').name('다이버');
fL.add(params, 'bubbles').name('공기방울');
const fC = gui.addFolder('카메라  ·  Lens');
fC.add(params, 'tilt').name('미니어처 블러');
fC.add(params, 'blur', 0, 6, 0.01).name('블러 세기');
fC.add(params, 'focus', 0.1, 0.9, 0.01).name('초점 높이');
fC.add(params, 'autoRotate').name('자동 회전');
gui.add({reset(){ Object.assign(params, defaults); gui.controllersRecursive().forEach(c => c.updateDisplay()); applyAll(); }}, 'reset').name('기본값으로 되돌리기');
gui.onChange(applyAll);
if(innerWidth < 760) gui.close();

/* ───────────── loop ───────────── */
const clock = new THREE.Clock();
let fishT = 0, waveT = 0, diverT = 0, introDone = reduceMotion;
let lastAz = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), m4 = new THREE.Matrix4(), tailLocal = new THREE.Matrix4(), tailRot = new THREE.Matrix4(), scl = new THREE.Matrix4();
const upY = new THREE.Vector3(0,1,0);
const introStart = performance.now();
if(reduceMotion) camera.position.copy(target).addScaledVector(camDir, fitDistance());

function waveHJS(x, z){
  const t = waveT;
  let h = 0.5*Math.sin(x*1.3 + t*1.1) + 0.35*Math.sin(z*1.7 - t*1.4 + x*0.4) + 0.22*Math.sin((x+z)*2.6 + t*2.1) + 0.12*Math.sin((x-z)*4.1 - t*2.7);
  return h*params.waveAmp + x*jel.tilt.x + z*jel.tilt.y;
}

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 1/30);
  const tm = reduceMotion ? 0.35 : 1;
  U.uTime.value += dt*tm;
  waveT += dt*params.waveSpeed*tm; U.uWaveTime.value = waveT;
  const time = U.uTime.value;

  /* intro dolly */
  if(!introDone){
    const k = Math.min(1, (performance.now() - introStart)/2600); const e = 1 - Math.pow(1-k, 3);
    camera.position.copy(target).addScaledVector(camDir, fitDistance()*(1.45 - 0.45*e));
    if(k >= 1) introDone = true;
  }
  controls.update();

  /* camera rotation sloshes the water */
  const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  let dAz = az - lastAz; if(dAz > Math.PI) dAz -= 2*Math.PI; if(dAz < -Math.PI) dAz += 2*Math.PI; lastAz = az;
  if(Math.abs(dAz) > 1e-5){ slosh(Math.cos(az), -Math.sin(az), dAz*0.35*params.slosh); }

  /* jelly springs */
  const k = params.stiffness*0.25, c = params.damping;
  for(let s=0;s<2;s++){
    const h = dt/2;
    jel.vel.x += (-k*jel.tilt.x - c*jel.vel.x)*h; jel.vel.y += (-k*jel.tilt.y - c*jel.vel.y)*h;
    jel.tilt.x += jel.vel.x*h; jel.tilt.y += jel.vel.y*h;
    jel.wobV += (-k*1.6*jel.wob - c*1.3*jel.wobV)*h; jel.wob += jel.wobV*h;
  }
  jel.tilt.clampLength(0, 0.07); jel.wob = THREE.MathUtils.clamp(jel.wob, -0.06, 0.06);
  U.uTilt.value.copy(jel.tilt);
  waterGroup.scale.set(1 - jel.wob*0.35, 1 + jel.wob, 1 - jel.wob*0.35);

  /* boat bobbing */
  const topY = BASE_H + DEPTH*waterGroup.scale.y;
  const bh = waveHJS(BOAT_X, BOAT_Z);
  const hx = (waveHJS(BOAT_X+0.5, BOAT_Z) - waveHJS(BOAT_X-0.5, BOAT_Z));
  const hz = (waveHJS(BOAT_X, BOAT_Z+0.5) - waveHJS(BOAT_X, BOAT_Z-0.5));
  boat.position.set(BOAT_X, topY + bh + 0.02, BOAT_Z);
  boat.rotation.set(hz*0.9, BOAT_YAW + Math.sin(time*0.2)*0.05, -hx*0.9, 'YXZ');
  boat.updateMatrixWorld(); tmpA.set(1.0, 0.12, 0).applyMatrix4(boat.matrixWorld);
  updateRope(dt*tm, time, tmpA);
  updateJellies(dt*tm, time);

  /* god rays follow the sun, face the camera */
  const travel = sunDir.clone().negate();
  const horiz = new THREE.Vector3(travel.x, 0, travel.z);
  for(const r of rays){
    const sx = THREE.MathUtils.clamp(r.userData.x - horiz.x*1.6, -2.7, 2.7), sz = THREE.MathUtils.clamp(r.userData.z - horiz.z*1.6, -2.7, 2.7);
    r.position.set(sx, WATER_TOP - 0.05, sz);
    const yAxis = sunDir; const toCam = tmpA.copy(camera.position).sub(r.position).normalize();
    const xAxis = tmpB.crossVectors(yAxis, toCam).normalize(); const zAxis = new THREE.Vector3().crossVectors(xAxis, yAxis);
    r.matrix.makeBasis(xAxis, yAxis, zAxis).setPosition(r.position); r.matrixAutoUpdate = false; r.matrixWorldNeedsUpdate = true;
  }

  /* crew, divers, fish */
  animateCrew(time);
  if(params.divers){ diverT += dt*tm; updateDivers(dt*tm, diverT); }
  updateFish(dt*params.fishSpeed*tm, time);

  /* bubbles */
  if(params.bubbles){
    for(let i=0;i<BUB;i++){
      const d = bubData[i];
      if(!d.alive){ d.delay -= dt; if(d.delay <= 0) spawnBubble(i); continue; }
      bubPos[i*3+1] += d.vy*dt*tm;
      bubPos[i*3] += Math.sin(time*3 + i)*0.003; bubPos[i*3+2] += Math.cos(time*2.6 + i)*0.003;
      d.vy = Math.min(d.vy + dt*0.15, 1.4);
      if(bubPos[i*3+1] > topY - 0.05){ d.alive = false; d.delay = rr(0.3, 3.5); bubPos[i*3+1] = -100;
        if(rand() < 0.08) addRipple(bubPos[i*3], bubPos[i*3+2], 0.12); }
    }
    bubGeo.attributes.position.needsUpdate = true;
  }

  /* marine snow */
  const sp = snowGeo.attributes.position;
  for(let i=0;i<snowN;i++){
    let y = sp.getY(i) - dt*0.05*tm; if(y < BASE_H + 0.2) y = WATER_TOP - 0.2;
    sp.setY(i, y); sp.setX(i, sp.getX(i) + Math.sin(time*0.4 + i)*0.0008);
  }
  sp.needsUpdate = true;

  composer.render();
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  updateTilt();
});
})();
</script>
